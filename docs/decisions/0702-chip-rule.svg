<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="1180" height="520" role="img" aria-label="Three toolbar strips showing the Hidden chip: with room, two names then +2 more; narrow, Hidden (4); and the Show menu open, with the Show everything tooltip listing all four hidden items."><rect width="1180" height="520" fill="#15171a"/><text x="20" y="30" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#e6e9ee" text-anchor="start" font-weight="bold">The one shared chip: a length rule (mock-up, not a capture)</text><text x="20" y="52" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="normal">Hidden here: Rapid, Lead-in and ramp (moves) and Margin, Stops beside a grip (Facing labels): four items.</text><text x="20" y="88" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="bold">1. Room in the strip (1920 × 1080, view about 1300 px wide): two names, then a count</text><rect x="20" y="100" width="800" height="40" fill="#1e2228" stroke="#30353d"/><text x="32" y="125" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="start" font-weight="normal">Shaded Wire Edges | Persp Ortho | Front Top Iso | Fit</text><rect x="372" y="109" width="62" height="22" rx="3" fill="#2a3038" stroke="#4a525c"/><text x="382" y="125" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#e6e9ee" text-anchor="start" font-weight="normal">Show ⏷</text><rect x="442" y="109" width="277" height="22" rx="11" fill="none" stroke="#f2b84b"/><text x="580.7" y="125" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#f2b84b" text-anchor="middle" font-weight="normal">Hidden: Rapid, Lead-in and ramp +2 more</text><text x="836" y="118" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="normal">At most two names, in menu order,</text><text x="836" y="134" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="normal">then &quot;+N more&quot;.</text><text x="20" y="178" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="bold">2. Not enough room for that (1366 × 768, best effort): the short form</text><rect x="20" y="190" width="640" height="40" fill="#1e2228" stroke="#30353d"/><text x="32" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="start" font-weight="normal">Shaded Wire Edges | Persp Ortho | Front Top Iso | Fit</text><rect x="372" y="199" width="62" height="22" rx="3" fill="#2a3038" stroke="#4a525c"/><text x="382" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#e6e9ee" text-anchor="start" font-weight="normal">Show ⏷</text><rect x="442" y="199" width="86" height="22" rx="11" fill="none" stroke="#f2b84b"/><text x="485.0" y="215" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#f2b84b" text-anchor="middle" font-weight="normal">Hidden (4)</text><text x="676" y="208" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="normal">Only the count. Simulate&#x27;s inline Show</text><text x="676" y="224" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="normal">choices move into the menu first (OI-529).</text><text x="20" y="268" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="bold">3. The full list: the tooltip of Show everything in the Show menu (V); the chip is a plain label</text><rect x="20" y="280" width="640" height="40" fill="#1e2228" stroke="#30353d"/><text x="32" y="305" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#c9d1d9" text-anchor="start" font-weight="normal">Shaded Wire Edges | Persp Ortho | Front Top Iso | Fit</text><rect x="372" y="289" width="62" height="22" rx="3" fill="#2a3038" stroke="#4a525c"/><text x="382" y="305" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#e6e9ee" text-anchor="start" font-weight="normal">Show ⏷</text><rect x="442" y="289" width="86" height="22" rx="11" fill="none" stroke="#f2b84b"/><text x="485.0" y="305" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#f2b84b" text-anchor="middle" font-weight="normal">Hidden (4)</text><text x="676" y="298" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="normal">Show everything has the keyboard (Tab); its</text><text x="676" y="314" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="normal">tooltip opens on focus and on hover (0677).</text><rect x="442" y="350" width="470" height="96" rx="4" fill="#2a3038" stroke="#4a525c"/><text x="454" y="370" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#e6e9ee" text-anchor="start" font-weight="normal">Hidden in the view: Rapid, Lead-in and ramp,</text><text x="454" y="389" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#e6e9ee" text-anchor="start" font-weight="normal">Facing margin, Facing stops.</text><text x="454" y="408" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#e6e9ee" text-anchor="start" font-weight="normal">Only the view changes: the G-code, the simulation, the checks</text><text x="454" y="427" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#e6e9ee" text-anchor="start" font-weight="normal">and the notes do not. Show everything shows them all again.</text><text x="20" y="480" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="normal">Names: a group hidden whole reads as one name (&quot;Entry and exit&quot;, &quot;Facing labels&quot;). The chip is a plain label: no tooltip, no Tab stop, and a click does nothing (decision 0693).</text><text x="20" y="500" font-family="DejaVu Sans, sans-serif" font-size="12" fill="#9aa6b5" text-anchor="start" font-weight="normal">The chip is never cut: it always gets at least the short form&#x27;s width. The way back is &quot;Show everything&quot; in the Show menu (V) while anything is hidden.</text></svg>