<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" font-family="sans-serif" font-size="13">
  <title>Issue 774: the held region section with its Kept clear information row, and a side view of the 0.5 mm every tool keeps from the grip</title>
  <rect width="720" height="560" fill="#1e1f22"/>
  <!-- Inspector mock -->
  <rect x="20" y="16" width="400" height="232" rx="4" fill="#26282c" stroke="#3a3d42"/>
  <text x="34" y="40" fill="#9aa0a6" font-size="11" font-weight="bold">WORKHOLDING AND TABS</text>
  <text x="34" y="66" fill="#e8eaed">☑ Held at the start</text>
  <text x="44" y="94" fill="#c4c7c5">Grip length</text>
  <rect x="190" y="80" width="110" height="20" rx="2" fill="#17181b" stroke="#3a3d42"/>
  <text x="198" y="95" fill="#e8eaed">3.000</text><text x="306" y="95" fill="#9aa0a6">mm</text>
  <text x="44" y="122" fill="#c4c7c5">Holding diameter</text>
  <rect x="190" y="108" width="110" height="20" rx="2" fill="#17181b" stroke="#3a3d42"/>
  <text x="198" y="123" fill="#80868b">stock Ø20</text><text x="306" y="123" fill="#9aa0a6">mm</text>
  <text x="44" y="150" fill="#c4c7c5">Held span</text>
  <text x="190" y="150" fill="#e8eaed">X −7.000 to −4.000 mm</text>
  <!-- New row -->
  <rect x="28" y="160" width="384" height="80" rx="3" fill="#1f2a36" stroke="#4c8bf5" stroke-dasharray="4 3"/>
  <circle cx="52" cy="178" r="7" fill="none" stroke="#8ab4f8"/>
  <text x="49" y="182" fill="#8ab4f8" font-size="10" font-weight="bold">i</text>
  <text x="66" y="182" fill="#c4c7c5">Kept clear</text>
  <text x="190" y="182" fill="#e8eaed">to X −1.500 mm</text>
  <text x="44" y="202" fill="#9aa0a6" font-size="11.5">No tool comes within 0.500 mm of the grip. Corners</text>
  <text x="44" y="217" fill="#9aa0a6" font-size="11.5">beside the grip may keep more material.</text>
  <text x="430" y="200" fill="#8ab4f8" font-size="11">← information, one row</text>
  <text x="430" y="215" fill="#8ab4f8" font-size="11">per held region, widest tool</text>
  <!-- Side view -->
  <text x="430" y="276" fill="#9aa0a6" font-size="11" font-weight="bold">SIDE VIEW ALONG X (synthetic)</text>
  <rect x="40" y="440" width="640" height="70" fill="#3b3326" stroke="#7a6a4f"/>
  <defs><pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#9aa0a6" stroke-width="2"/></pattern></defs>
  <rect x="40" y="440" width="137" height="70" fill="url(#h)" opacity="0.7"/>
  <text x="58" y="530" fill="#c4c7c5" font-size="11">held X −7 to −4</text>
  <rect x="177" y="440" width="23" height="70" fill="#4c8bf5" opacity="0.35"/>
  <text x="150" y="432" fill="#8ab4f8" font-size="11">0.500</text>
  <!-- tool: radius 2 mm = 91 px at 45.7 px/mm; drawn at the keep-out edge -->
  <circle cx="291" cy="349" r="91" fill="#5f6368" opacity="0.55" stroke="#e8eaed"/>
  <line x1="291" y1="349" x2="291" y2="440" stroke="#f28b82" stroke-dasharray="3 3"/>
  <text x="298" y="432" fill="#f28b82" font-size="11">tip at X −1.5</text>
  <line x1="177" y1="518" x2="291" y2="518" stroke="#e8eaed"/>
  <text x="196" y="550" fill="#e8eaed" font-size="11">2.500 = radius 2.000 + 0.500</text>
  <text x="470" y="480" fill="#c4c7c5" font-size="11">part from X 0</text>
</svg>
