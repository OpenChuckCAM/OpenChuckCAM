<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Tool load on the public crankshaft: the heaviest cut section of each operation</title>
<rect width="1000" height="440" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#222">Public crankshaft (STL), 38 mm hardwood bar: heaviest cut section of each operation, log scale</text>
<text x="20" y="48" fill="#444">Measured in the program's own simulation (0.1 mm cells) by a throwaway prototype on main aadf3cc; each figure is over one tool diameter (3.175 mm) of travel.</text>
<!-- axis: log10 from 0.5 to 300 mapped to x 300..940 ; log10(0.5)=-0.301, log10(300)=2.477 ; span 2.778 -> 640px ; 230.4 px per decade -->
<line x1="300" y1="320" x2="940" y2="320" stroke="#222"/>
<g fill="#222" text-anchor="middle">
<line x1="369.4" y1="320" x2="369.4" y2="326" stroke="#222"/><text x="369.4" y="342">1</text>
<line x1="599.8" y1="320" x2="599.8" y2="326" stroke="#222"/><text x="599.8" y="342">10</text>
<line x1="830.2" y1="320" x2="830.2" y2="326" stroke="#222"/><text x="830.2" y="342">100</text>
<text x="620" y="364">cut section, mm² (material removed per millimetre of travel)</text>
</g>
<!-- limits: 3.175 -> log=0.5017 -> x=300+(0.5017+0.301)*230.4=484.9 ; 6.35 -> 0.8028 -> 554.3 -->
<line x1="484.9" y1="80" x2="484.9" y2="320" stroke="#888" stroke-dasharray="4 3"/>
<text x="480" y="76" text-anchor="end" fill="#555">1 × the tool's slot at its stepdown, 3.175</text>
<line x1="554.3" y1="92" x2="554.3" y2="320" stroke="#b02a1e" stroke-dasharray="6 3" stroke-width="1.5"/>
<text x="560" y="96" fill="#b02a1e">2 ×, 6.35: the warning, if Q2 is answered A</text>
<!-- bars: x from 300 to value -->
<!-- Rough 5.32 -> log 0.726 -> x 536.6 -->
<text x="290" y="135" text-anchor="end" fill="#222">Rough (3.175 flat, stepdown 1)</text>
<rect x="300" y="120" width="236.6" height="22" fill="#6c8ebf"/>
<text x="562" y="136" fill="#222">5.32; engaged length up to 14.7 (slivers); 0 stretches over 2 ×</text>
<!-- Finish after rough 1.47 -> log 0.167 -> x 407.9 -->
<text x="290" y="195" text-anchor="end" fill="#222">Finish after Rough (3.175 ball)</text>
<rect x="300" y="180" width="107.9" height="22" fill="#5aa469"/>
<text x="562" y="196" fill="#222">1.47; engaged length up to 10.1 (slivers); 0 over 2 ×</text>
<!-- Finish alone 185.74 -> log 2.269 -> x 892.1 -->
<text x="290" y="255" text-anchor="end" fill="#222">Finish alone, nothing roughed</text>
<rect x="300" y="240" width="592.1" height="22" fill="#d0473b"/>
<text x="562" y="284" fill="#b02a1e">185.7; engaged length up to 21.5 of the 22 mm flute;</text><text x="562" y="300" fill="#b02a1e">4,757 of 19,183 stretches over 2 ×</text>
<text x="20" y="400" fill="#444">Today none of the three gives a warning about load: the flute check (decisions 0509, 0522) warns only past the flute length, and 21.5 mm is under 22.</text>
<text x="20" y="420" fill="#444">Cost of the measure in the prototype: about 0.6 s on a 12 s simulation of the finish (about 5 %). Raw figures: docs/archive/0698-managing-tool-load.</text>
</svg>
