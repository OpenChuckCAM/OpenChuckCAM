<text x="442.0" y="190.25" text-anchor="end" fill="#d9480f" font-size="11">step along the seam</text>
<text x="750.0" y="94" text-anchor="middle" font-weight="bold" fill="#222">Blended: a blend over φ (Blend over, here 45°)</text>
<text x="750.0" y="111" text-anchor="middle" fill="#444">A turns on by φ over the blend; ring k+1 starts φ further round</text>
