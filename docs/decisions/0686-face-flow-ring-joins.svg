<text x="554" y="532" text-anchor="end" fill="#444" font-size="11">1980°</text>
<text x="260" y="680" text-anchor="middle" fill="#222" font-size="12">Every ring is a whole turn from the seam back to it;</text>
<text x="260" y="696" text-anchor="middle" fill="#222" font-size="12">the tool then steps one stepover along the seam with A</text>
<text x="260" y="712" text-anchor="middle" fill="#222" font-size="12">held (a square corner at each end) and the next ring</text>
<text x="260" y="728" text-anchor="middle" fill="#222" font-size="12">starts on the seam, the same way round.</text>
<text x="750" y="680" text-anchor="middle" fill="#222" font-size="12">Every ring is a whole turn from its own start; the tool</text>
<text x="750" y="696" text-anchor="middle" fill="#222" font-size="12">then moves on to the next ring while A turns on by φ,</text>
<text x="750" y="712" text-anchor="middle" fill="#222" font-size="12">so ring k+1 starts φ further round. A builds up</text>
<text x="750" y="728" text-anchor="middle" fill="#222" font-size="12">360° + φ per ring. The default for a new operation.</text>
<text x="500" y="760" text-anchor="middle" fill="#222" font-size="12.5">Either way no strip is left along the seam: every ring meets its own start, and the step or blend is an extra cut on the face, not a gap.</text>
<text x="20" y="795" font-weight="bold" fill="#222">Where the tool lifts instead (then it links as before), for either join</text>
<text x="34" y="819" fill="#222" font-size="12">(a) a wall or another part of the model is in the way (the tool would not sit on this face there);  (b) the join would leave the face,</text>
<text x="34" y="839" fill="#222" font-size="12">or a ring between was left out;  (c) the face's normal along it is tilted from the tool more than Maximum tilt plus the lead angle;</text>
<text x="34" y="859" fill="#222" font-size="12">(d) a straight move along it would stray from the face by more than the tolerance;  (e) a ring is broken by a stretch the tool cannot reach;</text>
<text x="34" y="879" fill="#222" font-size="12">(f) Stay down between passes is off.  On a cone to its point the joins run on towards it; rings shorter round than the tool are left out and noted.</text>
<text x="34" y="899" fill="#222" font-size="12">Measured: a full cylinder (12 rings) and a cone to its point (10 rings) are each one run, with either join and every Cutting direction.</text>
</svg>