<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 960" width="1000" height="960" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Face flow: how ring k joins ring k+1 on a face that closes round on itself</title>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker></defs>
<rect width="1000" height="960" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#222">Face flow on a face that closes round on itself: how ring k joins ring k+1</text>
<text x="20" y="48" fill="#444">Steps between rings, with Stay down between passes. The face unrolled: across = once round (0 to 360°), down = along the face from its guide end.</text>
<text x="20" y="66" fill="#444">The dashed edges are the same seam on the part. Rings never reverse: every ring runs the same way round, whatever the Cutting direction.</text>
<text x="260.0" y="94" text-anchor="middle" font-weight="bold" fill="#222">Sharp: a step along the seam</text>
<text x="260.0" y="111" text-anchor="middle" fill="#444">A held over the step; the next ring starts on the seam</text>
