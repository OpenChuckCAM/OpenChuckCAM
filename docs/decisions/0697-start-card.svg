<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="The start card with no project open, in a 1920 by 1080 window at half scale: New project, Open project, the drop zone and the recent projects">
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <!-- Decision 0697 (issue #706). A drawing at half scale of a 1920 by 1080 window, not a capture. Project names and folders are made up. -->
  <rect width="960" height="540" fill="#121417"/>
  <rect x="0" y="0" width="960" height="14" fill="#1e2228"/>
  <text x="8" y="10.5" fill="#c9d1d9" font-size="8" font-family="sans-serif">File   Edit   View   Project   Tools   Help</text>
  <rect x="0" y="14" width="960" height="22" fill="#1a1d21"/>
  <text x="8" y="29" fill="#6b7682" font-size="9" font-family="sans-serif">1 Model   2 Setup   3 Operations   4 Simulate</text>
  <rect x="0" y="36" width="150" height="486" fill="#1a1d21"/>
  <text x="8" y="52" fill="#6b7682" font-size="8" font-family="sans-serif">No project open</text>
  <rect x="810" y="36" width="150" height="486" fill="#1a1d21"/>
  <rect x="150" y="36" width="660" height="486" fill="#191c20"/>
  <rect x="340" y="80" width="280" height="330" rx="4" fill="#1f2329" stroke="#353c45"/>
  <g font-family="sans-serif">
    <text x="352" y="100" fill="#e6e9ee" font-size="11" font-weight="bold">Start a project</text>
    <rect x="352" y="108" width="72" height="16" rx="2" fill="#2f6fd6"/>
    <text x="358" y="119.5" fill="#fff" font-size="8" font-weight="bold">New project…</text>
    <rect x="430" y="108" width="72" height="16" rx="2" fill="#2a3038" stroke="#4a525c"/>
    <text x="436" y="119.5" fill="#e6e9ee" font-size="8">Open project…</text>
    <rect x="352" y="132" width="256" height="40" rx="3" fill="none" stroke="#6b7682" stroke-dasharray="4 3"/>
    <text x="480" y="149" fill="#c9d1d9" font-size="7.5" text-anchor="middle">Drop an STL or STEP file here to start a project with it,</text>
    <text x="480" y="161" fill="#c9d1d9" font-size="7.5" text-anchor="middle">or a project folder to open it.</text>
    <text x="352" y="188" fill="#9aa6b5" font-size="6.5" font-weight="bold" letter-spacing="0.5">RECENT PROJECTS</text>
    <rect x="352" y="193" width="256" height="16" rx="2" fill="#263040" stroke="#6fa3ff"/>
    <text x="358" y="204" fill="#e6e9ee" font-size="7.5">stepped-cylinder</text><text x="450" y="204" fill="#9aa6b5" font-size="7">~/CAM/stepped-cylinder</text>
    <text x="358" y="221" fill="#e6e9ee" font-size="7.5">baluster-project</text><text x="450" y="221" fill="#9aa6b5" font-size="7">~/CAM/examples/baluster-project</text>
    <text x="358" y="238" fill="#e6e9ee" font-size="7.5">demo-shaft</text><text x="450" y="238" fill="#9aa6b5" font-size="7">~/CAM/demo-shaft</text>
    <text x="358" y="255" fill="#e6e9ee" font-size="7.5">test-bar-40mm</text><text x="450" y="255" fill="#9aa6b5" font-size="7">/mnt/share/jobs/test-bar-40mm</text>
    <text x="358" y="276" fill="#6fa3ff" font-size="7.5">Clear recent list</text>
    <line x1="352" y1="286" x2="608" y2="286" stroke="#353c45"/>
    <text x="352" y="300" fill="#6b7682" font-size="7">1 Model — import the part</text>
    <text x="352" y="312" fill="#6b7682" font-size="7">2 Setup — stock, holding and machine</text>
    <text x="352" y="324" fill="#6b7682" font-size="7">3 Operations — strategies and tools</text>
    <text x="352" y="336" fill="#6b7682" font-size="7">4 Simulate — check the cut, then post</text>
  </g>
  <rect x="0" y="522" width="960" height="18" fill="#1e2228"/>
  <g font-family="sans-serif" font-size="8.5" fill="#9aa6b5">
    <text x="160" y="440">The first recent row has the keyboard (focus ring); Tab moves through the rows, Enter opens through Open.</text>
    <text x="160" y="454">With a project open and no model: "Start with a model", Import model… and the import drop line; the recent list stays.</text>
  </g>
</svg>
