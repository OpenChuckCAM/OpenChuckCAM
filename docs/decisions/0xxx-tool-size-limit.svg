<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img">
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<title>The largest tool profile: every point within 1000 mm of the tip in radius and height</title>
<rect x="0" y="0" width="720" height="400" fill="#ffffff"/>
<text x="30" y="24" fill="#222222" font-size="14" font-weight="bold">A tool profile in the (radius, height) half-plane, not to scale</text>
<rect x="90" y="70" width="300" height="250" fill="#dff0d8" stroke="#2e7d32" stroke-width="1.5"/>
<text x="240" y="100" fill="#2e7d32" text-anchor="middle">accepted: radius and height</text>
<text x="240" y="118" fill="#2e7d32" text-anchor="middle">each at most 1000 mm</text>
<rect x="390" y="70" width="290" height="250" fill="#f3d6d3" stroke="none"/>
<rect x="90" y="50" width="590" height="20" fill="#f3d6d3" stroke="none"/>
<text x="535" y="160" fill="#c0392b" text-anchor="middle">refused, naming the segment:</text>
<text x="535" y="178" fill="#c0392b" text-anchor="middle">"the radius 7.777717777777778e307 mm</text>
<text x="535" y="196" fill="#c0392b" text-anchor="middle">is larger than 1000 mm, the largest size</text>
<text x="535" y="214" fill="#c0392b" text-anchor="middle">a tool profile can have"</text>
<line x1="90" y1="320" x2="690" y2="320" stroke="#222222" stroke-width="1.2"/>
<line x1="90" y1="320" x2="90" y2="45" stroke="#222222" stroke-width="1.2"/>
<text x="690" y="340" fill="#222222" text-anchor="end">radius from the tool axis</text>
<text x="84" y="50" fill="#222222" text-anchor="end">height</text>
<text x="90" y="340" fill="#222222" text-anchor="middle">tip (0, 0)</text>
<text x="390" y="340" fill="#222222" text-anchor="middle">1000 mm</text>
<text x="84" y="76" fill="#222222" text-anchor="end">1000 mm</text>
<polyline points="90,320 150,320 190,300 210,260 210,140" fill="none" stroke="#1f5fa8" stroke-width="2.5"/>
<text x="220" y="250" fill="#1f5fa8">a real cutter: a few mm</text>
<line x1="90" y1="320" x2="676" y2="320" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="676" y="306" fill="#c0392b" text-anchor="end">the nightly fuzz input: one line to radius 7.8e307 mm</text>
<text x="30" y="368" fill="#555555" font-size="12">Arc centres, and an arc radius given by size, are checked the same way.</text>
<text x="30" y="386" fill="#555555" font-size="12">A standard tool: diameter and shank diameter at most 2000 mm, flute and overall length at most 1000 mm.</text>
</svg>
