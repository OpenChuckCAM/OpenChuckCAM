<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="sans-serif" font-size="13">
  <title>Issue 871: in a dialog, its own controls confirm the typed field and Cancel drops it without a question; the main window's panels keep the question</title>
  <rect width="760" height="300" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect x="20" y="20" width="340" height="200" rx="6" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="34" y="44" font-weight="bold">A dialog or tool window (Import model)</text>
  <rect x="34" y="60" width="230" height="26" rx="3" fill="#ffffff" stroke="#1a73e8"/>
  <text x="42" y="78">models/part.stl  (typed, no Enter)</text>
  <rect x="34" y="104" width="130" height="26" rx="3" fill="#ffffff" stroke="#5f6368"/>
  <text x="42" y="122">Check and preview</text>
  <rect x="174" y="104" width="80" height="26" rx="3" fill="#ffffff" stroke="#5f6368"/>
  <text x="186" y="122">Browse…</text>
  <rect x="34" y="176" width="70" height="26" rx="3" fill="#ffffff" stroke="#5f6368"/>
  <text x="46" y="194">Cancel</text>
  <text x="120" y="194" fill="#5f6368">close box, Esc</text>
  <text x="34" y="156" fill="#188038">its own controls confirm the field</text>
  <text x="34" y="214" fill="#188038" font-size="12">Cancel drops the typed text: no question</text>
  <rect x="400" y="20" width="340" height="200" rx="6" fill="#f1f3f4" stroke="#5f6368"/>
  <text x="414" y="44" font-weight="bold">The main window (an inspector)</text>
  <rect x="414" y="60" width="200" height="26" rx="3" fill="#ffffff" stroke="#1a73e8"/>
  <text x="422" y="78">Stepover 1.6  (typed, no Enter)</text>
  <rect x="414" y="104" width="150" height="26" rx="3" fill="#ffffff" stroke="#5f6368"/>
  <text x="422" y="122">Continue / Generate</text>
  <text x="414" y="156" fill="#b06000">leaving the form asks, as before:</text>
  <text x="414" y="176" fill="#b06000">"Unconfirmed changes": Keep, Discard,</text>
  <text x="414" y="196" fill="#b06000">Cancel (decision 0233)</text>
  <text x="20" y="250" fill="#5f6368">Nothing typed in a dialog reaches the project before the dialog's own accept, so there is nothing to keep or discard.</text>
  <text x="20" y="272" fill="#5f6368">A library window keeps its own "Discard the changes?" for its draft; it never asks both questions.</text>
</svg>
