<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Decision 0684, cause B: the pencil rest is placed flush against the wall, where the drop is a knife edge</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="760" height="510" fill="#ffffff"/>
  <text x="20" y="22" font-weight="bold" font-size="13">Cause B: the rest is bisected to the place where the flat's side touches the wall</text>
  <polygon points="60.0,460.0 60.0,420.0 300.0,420.0 300.0,260.0 420.0,260.0 420.0,460.0" fill="#85929e"/>
  <text x="66.0" y="440.0" fill="#ffffff">bar, radius 8</text>
  <text x="312.0" y="340.0" fill="#ffffff">shoulder</text>
  <text x="312.0" y="356.0" fill="#ffffff">(wall at X 12)</text>
  <rect x="220.0" y="260.0" width="80.0" height="160.0" fill="#d6eaf8" fill-opacity="0.55" stroke="#2c3e50" stroke-width="2"/>
  <text x="226.0" y="276.0" fill="#2c3e50">rest at X 11</text><text x="226.0" y="296.0" fill="#2c3e50">(exactly)</text>
  <rect x="220.0" y="100.0" width="80.0" height="160.0" fill="none" stroke="#2c3e50" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="226.0" y="116.0" fill="#2c3e50">the same drop, read as</text>
  <text x="226.0" y="132.0" fill="#2c3e50">resting on the shoulder</text>
  <line x1="200.0" y1="420.0" x2="200.0" y2="260.0" stroke="#333" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="66.0" y="340.0" fill="#333">lifted 4 mm</text>
  <line x1="300.0" y1="400.0" x2="300.0" y2="264.0" stroke="#c0392b" stroke-width="3"/>
  <text x="434.0" y="160.0" fill="#c0392b">Red: the flat's side lies exactly in the wall's plane.</text>
  <text x="434.0" y="178.0" fill="#333">Dropped there, the tool rests on the bar at some A and on</text>
  <text x="434.0" y="196.0" fill="#333">the shoulder's top (radius 12) at others, on the tessellation</text>
  <text x="434.0" y="214.0" fill="#333">and on the exact faces alike.</text>
  <text x="434.0" y="232.0" fill="#333">A move between two rests is checked against drops along it</text>
  <text x="434.0" y="250.0" fill="#333">(decision 0162): a drop read on the shoulder says the move</text>
  <text x="434.0" y="268.0" fill="#333">cuts the part, so the pass rides up 4 mm or ends there.</text>
  <text x="434.0" y="286.0" fill="#333">With exact contact on: 262 of 621 points lifted, 31 passes.</text>
  <text x="434.0" y="304.0" fill="#27ae60">Option P1: rest a tenth of the tolerance clear of the wall</text>
  <text x="434.0" y="322.0" fill="#27ae60">(0.001 mm): at X 10.999 every A rests on the bar.</text>
  <line x1="140.0" y1="460.0" x2="140.0" y2="465.0" stroke="#333"/>
  <text x="132.0" y="478.0" fill="#333">X 8</text>
  <line x1="220.0" y1="460.0" x2="220.0" y2="465.0" stroke="#333"/>
  <text x="212.0" y="478.0" fill="#333">X 10</text>
  <line x1="260.0" y1="460.0" x2="260.0" y2="465.0" stroke="#333"/>
  <text x="252.0" y="478.0" fill="#333">X 11</text>
  <line x1="300.0" y1="460.0" x2="300.0" y2="465.0" stroke="#333"/>
  <text x="292.0" y="478.0" fill="#333">X 12</text>
  <line x1="380.0" y1="460.0" x2="380.0" y2="465.0" stroke="#333"/>
  <text x="372.0" y="478.0" fill="#333">X 14</text>
  <text x="60.0" y="494.0" fill="#555">Section through the rotary axis (along X, left to right); up the page is up the tool axis, away from the bar. 1 mm = 40 px.</text>
  <polygon points="300.0,420.0 284.0,420.0 300.0,280.0" fill="#e67e22"/>
</svg>
