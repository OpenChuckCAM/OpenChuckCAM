<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Tool load: where the measure and the relief sit, and the order they are built</title>
<rect width="1000" height="470" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#222">Where tool load is measured and managed, at the recommended answers</text>
<text x="20" y="48" fill="#444">Each operation in a setup: generate on the stock earlier operations left, then simulate, which hands the stock to the next operation (SIM-06).</text>
<defs><marker id="h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<!-- boxes -->
<rect x="30" y="90" width="190" height="70" rx="6" fill="#eef2f7" stroke="#6c8ebf"/>
<text x="125" y="120" text-anchor="middle" fill="#222">stock left by earlier</text>
<text x="125" y="138" text-anchor="middle" fill="#222">operations (or the blank)</text>
<rect x="290" y="90" width="200" height="70" rx="6" fill="#eef2f7" stroke="#6c8ebf"/>
<text x="390" y="120" text-anchor="middle" fill="#222">Generate</text>
<text x="390" y="138" text-anchor="middle" fill="#222">the strategy makes passes</text>
<rect x="560" y="90" width="200" height="70" rx="6" fill="#eef2f7" stroke="#6c8ebf"/>
<text x="660" y="120" text-anchor="middle" fill="#222">Simulate</text>
<text x="660" y="138" text-anchor="middle" fill="#222">cuts the stock, move by move</text>
<rect x="820" y="90" width="150" height="70" rx="6" fill="#eef2f7" stroke="#6c8ebf"/>
<text x="895" y="120" text-anchor="middle" fill="#222">next operation</text>
<text x="895" y="138" text-anchor="middle" fill="#222">of the setup</text>
<line x1="220" y1="125" x2="288" y2="125" stroke="#333" marker-end="url(#h)"/>
<line x1="490" y1="125" x2="558" y2="125" stroke="#333" marker-end="url(#h)"/>
<line x1="760" y1="125" x2="818" y2="125" stroke="#333" marker-end="url(#h)"/>
<!-- TL-1 -->
<rect x="560" y="210" width="410" height="90" rx="6" fill="#fdf1e6" stroke="#d08a3b"/>
<text x="572" y="232" font-weight="bold" fill="#222">TL-1 (first, the slice to judge): measure and warn</text>
<text x="572" y="252" fill="#222">engaged length, width of cut, cut section and removal rate</text>
<text x="572" y="270" fill="#222">per stretch; a warning past the limit with the figures and</text>
<text x="572" y="288" fill="#222">the place; the heaviest cut of each operation in Results</text>
<line x1="660" y1="160" x2="660" y2="208" stroke="#d08a3b" marker-end="url(#h)"/>
<!-- TL-3 -->
<rect x="290" y="330" width="330" height="80" rx="6" fill="#eaf5ec" stroke="#5aa469"/>
<text x="302" y="352" font-weight="bold" fill="#222">TL-3: relief by pass order</text>
<text x="302" y="372" fill="#222">the warning offers "Add roughing before this</text>
<text x="302" y="390" fill="#222">operation", with the tool's own cutting data</text>
<line x1="660" y1="300" x2="560" y2="328" stroke="#5aa469" marker-end="url(#h)"/>
<!-- TL-2 -->
<rect x="30" y="210" width="420" height="90" rx="6" fill="#eaf5ec" stroke="#5aa469"/>
<text x="42" y="232" font-weight="bold" fill="#222">TL-2: relief inside the strategy (Limit tool load)</text>
<text x="42" y="252" fill="#222">before each pass, the strategy reads how deep the stock</text>
<text x="42" y="270" fill="#222">stands over it and adds layers only where the cut would</text>
<text x="42" y="288" fill="#222">pass the limit (finishing layers; new for simultaneous)</text>
<line x1="125" y1="160" x2="125" y2="208" stroke="#5aa469" marker-end="url(#h)"/>
<line x1="390" y1="210" x2="390" y2="162" stroke="#5aa469" marker-end="url(#h)"/>
<!-- ramp -->
<rect x="30" y="330" width="230" height="80" rx="6" fill="#f3eef8" stroke="#8c6bb1"/>
<text x="42" y="352" font-weight="bold" fill="#222">Ramps (lane PATH-QUALITY, PQ-2)</text>
<text x="42" y="372" fill="#222">angle, legs, deepest step per</text>
<text x="42" y="390" fill="#222">traverse: the same terms</text>
<text x="20" y="450" fill="#444">Order: TL-1, then TL-3, then TL-2 (after lane SIMUL-EDGE, which also changes simultaneous finishing). Feed by engagement (SIM-10) stays later.</text>
</svg>
