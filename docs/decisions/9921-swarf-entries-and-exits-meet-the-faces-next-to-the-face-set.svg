<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" font-family="sans-serif" font-size="13">
<rect width="780" height="360" fill="#ffffff"/>
<text x="20" y="24" font-weight="bold">Seen down the tool axis, at the end of a swarf pass</text>
<rect x="40" y="264" width="324" height="36" fill="#d9d9d9"/>
<line x1="76" y1="264" x2="364" y2="264" stroke="#1f5fbf" stroke-width="4"/>
<text x="58" y="284" fill="#1f5fbf">face set: the wall cut (face 0)</text>
<rect x="364" y="66" width="36" height="234" fill="#d9d9d9"/>
<line x1="364" y1="66" x2="364" y2="300" stroke="#7a4fb0" stroke-width="4"/>
<text x="214" y="44" fill="#7a4fb0">face 1, next to the face set</text><text x="214" y="60" fill="#7a4fb0">(the end wall)</text>
<line x1="76" y1="210" x2="310" y2="210" stroke="#e07b00" stroke-width="3"/>
<text x="58" y="230" fill="#e07b00">the pass (tool centre) stops short</text>
<text x="58" y="246" fill="#e07b00">so the tool keeps off face 1</text>
<circle cx="310" cy="210" r="54" fill="none" stroke="#e07b00" stroke-width="2"/>
<polyline fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="6 4" points="310.0,210.0 314.2,209.8 318.4,209.3 322.6,208.5 326.7,207.4 330.7,205.9 334.5,204.1 338.2,202.0 341.7,199.7 345.1,197.1 348.2,194.2 351.1,191.1 353.7,187.7 356.0,184.2 358.1,180.5 359.9,176.7 361.4,172.7 362.5,168.6 363.3,164.4 363.8,160.2 364.0,156.0"/>
<circle cx="364" cy="156" r="54" fill="#c0392b" fill-opacity="0.15" stroke="#c0392b" stroke-width="2"/>
<text x="58" y="111.0" fill="#c0392b">the lead-out arc carries the tool</text>
<text x="58" y="127.0" fill="#c0392b">2.990 mm into face 1: silent on main</text>
<text x="500" y="70" font-weight="bold">Decision 9921</text>
<text x="500" y="94">Item 1 (built): every lead and helix</text>
<text x="500" y="112">position is measured against the</text>
<text x="500" y="130">faces next to the face set, sampled</text>
<text x="500" y="148">as swarf samples them (decision 0532).</text>
<text x="500" y="166"></text>
<text x="500" y="184">Option B (recommended): refused where</text>
<text x="500" y="202">a face is cut deeper than the pass</text>
<text x="500" y="220">cuts it where the move joins it, plus</text>
<text x="500" y="238">the tolerance and the sampling slack.</text>
<text x="500" y="256">Here: 2.990 mm against about 0.3 mm,</text>
<text x="500" y="274">so refused, naming face 1 and Entry.</text>
</svg>
