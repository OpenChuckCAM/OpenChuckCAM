<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400" font-family="sans-serif" font-size="13">
<rect width="780" height="400" fill="#ffffff"/>
<text x="20" y="24" font-weight="bold">Across the pass: the flank on the wall's rulings, a floor at their end</text>
<text x="20" y="56" font-weight="bold">Not lifted: unchanged</text>
<rect x="20" y="270" width="320" height="30" fill="#d9d9d9"/>
<rect x="20" y="126" width="60" height="144" fill="#d9d9d9"/>
<line x1="80" y1="270" x2="80" y2="126" stroke="#1f5fbf" stroke-width="4"/>
<text x="20" y="118" fill="#1f5fbf">wall (rulings)</text>
<text x="270" y="290">floor</text>
<path d="M 80 270 A 48 48 0 0 0 176 270 L 176 126 L 80 126 Z" fill="#e07b00" fill-opacity="0.25" stroke="#e07b00" stroke-width="2"/>
<text x="84" y="142" fill="#e07b00">ball, 3 mm radius</text>
<line x1="206" y1="270" x2="206" y2="318" stroke="#c0392b" stroke-width="2"/>
<text x="212" y="298.0" fill="#c0392b">3.000</text>
<text x="20" y="330">"The tool's end reaches 3.000 mm beyond</text>
<text x="20" y="346">the end of the rulings …"; the cut into the</text>
<text x="20" y="362">floor is measured and warned of (0532).</text>
<text x="410" y="56" font-weight="bold">Floor in an avoid set: lifted (0491)</text>
<rect x="410" y="270" width="320" height="30" fill="#d9d9d9"/>
<rect x="410" y="126" width="60" height="144" fill="#d9d9d9"/>
<line x1="470" y1="270" x2="470" y2="126" stroke="#1f5fbf" stroke-width="4"/>
<text x="410" y="118" fill="#1f5fbf">wall (rulings)</text>
<text x="660" y="290">floor</text>
<path d="M 470 222 A 48 48 0 0 0 566 222 L 566 126 L 470 126 Z" fill="#e07b00" fill-opacity="0.25" stroke="#e07b00" stroke-width="2"/>
<text x="474" y="142" fill="#e07b00">ball, 3 mm radius</text>
<line x1="596" y1="270" x2="596" y2="270" stroke="#2e8b57" stroke-width="2"/>
<text x="602" y="274.0" fill="#2e8b57">lift 3.000</text>
<text x="410" y="330">Said after the lift (option c): "would reach</text>
<text x="410" y="346">3.000 mm …; it is lifted at least that far all</text>
<text x="410" y="362">along the face". Information; no warning.</text>
</svg>
