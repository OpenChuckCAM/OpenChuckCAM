<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>Tool load: the three figures measured for each stretch of path</title>
<rect width="1000" height="560" fill="#ffffff"/>
<text x="20" y="28" font-size="17" font-weight="bold" fill="#222">What is measured: the material the tool actually removes, as the simulation cuts it</text>
<text x="20" y="48" fill="#444">Schematic, not to scale. Each stretch of one tool diameter of travel gives three figures; the cut section is the one that sets the load.</text>
<!-- Panel A: a heavy cut -->
<text x="40" y="84" font-size="14" font-weight="bold" fill="#222">A. Finish with nothing roughed first</text>
<rect x="40" y="150" width="280" height="300" fill="#e9d9b8" stroke="#8a7350"/>
<text x="46" y="170" fill="#6b5634">stock as it is</text>
<rect x="160" y="110" width="34" height="320" fill="#c8ccd2" stroke="#333"/>
<path d="M160,430 a17,17 0 0 0 34,0" fill="#c8ccd2" stroke="#333"/>
<rect x="160" y="150" width="34" height="297" fill="#d0473b" fill-opacity="0.55"/>
<line x1="210" y1="150" x2="210" y2="447" stroke="#222" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="216" y="300" fill="#222">engaged length</text>
<text x="216" y="316" fill="#222">21.5 mm of a</text>
<text x="216" y="332" fill="#222">22 mm flute</text>
<line x1="160" y1="470" x2="194" y2="470" stroke="#222" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="140" y="490" fill="#222">width of cut: the whole tool</text>
<text x="40" y="510" fill="#b02a1e">cut section up to 186 mm² (the proposed warning: 6.35)</text>
<!-- Panel B: a light finish -->
<text x="370" y="84" font-size="14" font-weight="bold" fill="#222">B. The same finish after roughing</text>
<path d="M370,450 L370,380 Q470,372 560,380 L650,380 L650,450 Z" fill="#e9d9b8" stroke="#8a7350"/>
<rect x="490" y="110" width="34" height="270" fill="#c8ccd2" stroke="#333"/>
<path d="M490,380 a17,17 0 0 0 34,0" fill="#c8ccd2" stroke="#333"/>
<path d="M490,380 a17,17 0 0 0 34,0 L524,374 L490,374 Z" fill="#d0473b" fill-opacity="0.55"/>
<line x1="540" y1="374" x2="540" y2="397" stroke="#222" stroke-width="1.5"/>
<text x="546" y="352" fill="#222">engaged length</text><text x="546" y="368" fill="#222">about 1 mm</text>
<text x="370" y="490" fill="#222">width of cut: the stepover</text>
<text x="370" y="510" fill="#1b6e3a">cut section at most 1.5 mm²</text>
<!-- Panel C: a sliver -->
<text x="700" y="84" font-size="14" font-weight="bold" fill="#222">C. A sliver at a shoulder</text>
<rect x="700" y="150" width="60" height="300" fill="#e9d9b8" stroke="#8a7350"/>
<rect x="760" y="300" width="200" height="150" fill="#e9d9b8" stroke="#8a7350"/>
<rect x="762" y="180" width="34" height="270" fill="#c8ccd2" stroke="#333"/>
<rect x="760" y="180" width="3" height="120" fill="#d0473b"/>
<line x1="812" y1="180" x2="812" y2="300" stroke="#222" stroke-width="1.5"/>
<text x="818" y="230" fill="#222">engaged length</text>
<text x="818" y="246" fill="#222">up to 10 mm</text>
<text x="700" y="490" fill="#222">width of cut: very thin</text>
<text x="700" y="510" fill="#1b6e3a">cut section well under 1 mm²: not a heavy cut</text>
<defs><marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs>
<text x="20" y="538" fill="#444">Cut section = material removed per millimetre of travel (mm³ per mm, so mm²),</text>
<text x="20" y="554" fill="#444">About engaged length × width of cut. Removal rate = section × feed.</text>
</svg>
