<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" role="img" aria-label="The same point along the rotary axis in two frames: 39.193 measured from the rotary reference point (the setup frame), and 21.203 measured from the work zero (the work frame), when Zero at X is 17.99.">
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <!-- Proposed decision WORDING-DOCS-E. A drawing, not a capture. The numbers are those of the flute-length example project: Zero at X 17.99, a warning "at X 39.193". -->
  <rect width="760" height="250" fill="#15171a"/>
  <g font-family="sans-serif" font-size="12.5" fill="#e6e9ee">
    <text x="16" y="26" font-weight="bold">One point on the part, two numbers today</text>
    <text x="16" y="46" fill="#9aa6b5" font-size="11.5">A point 39.193 mm from the rotary reference point, with Zero at X 17.99. The rule proposed: every position a message gives is the lower row.</text>
  </g>
  <g stroke="#9aa6b5" stroke-width="1.5" fill="none">
    <line x1="40" y1="110" x2="720" y2="110"/>
    <line x1="40" y1="190" x2="720" y2="190"/>
  </g>
  <g stroke="#e6e9ee" stroke-width="2">
    <line x1="80" y1="98" x2="80" y2="122"/>
  </g>
  <g stroke="#4cc38a" stroke-width="2">
    <line x1="250" y1="178" x2="250" y2="202"/>
  </g>
  <g stroke="#6fa3ff" stroke-width="2" stroke-dasharray="4 3">
    <line x1="250" y1="90" x2="250" y2="126"/>
  </g>
  <g stroke="#ff7b72" stroke-width="2">
    <line x1="520" y1="96" x2="520" y2="124"/>
    <line x1="520" y1="176" x2="520" y2="204"/>
  </g>
  <g font-family="sans-serif" font-size="12" fill="#e6e9ee">
    <text x="40" y="84">SETUP frame (the path messages and the Setup step today)</text>
    <text x="40" y="142" fill="#9aa6b5">rotary reference point, X 0</text>
    <text x="256" y="142" fill="#6fa3ff">work zero (Zero at X 17.99)</text>
    <text x="526" y="92" fill="#ff7b72">the point: X 39.193</text>
    <text x="40" y="164">WORK frame (the WCS: G-code, playback and cursor readouts)</text>
    <text x="256" y="222" fill="#4cc38a">work zero, X 0</text>
    <text x="526" y="172" fill="#ff7b72">the point: X 21.203</text>
  </g>
  <g font-family="sans-serif" font-size="11.5" fill="#9aa6b5">
    <text x="16" y="242">The work frame is the setup frame moved by Zero at X, so they agree only when Zero at X is 0. The machine frame adds Rotary reference X.</text>
  </g>
</svg>
