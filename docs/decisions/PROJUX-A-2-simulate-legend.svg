<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Simulate in a 1920 by 1080 window at half scale, toolpaths shown: the legend of moves at the top left of the view, the colour scale at the bottom left">
  <!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
  <!-- Decision PROJUX-A-2 (issue #789, the owner's answer P2b B). A drawing at half scale of a 1920 by 1080 window, not a capture. -->
  <rect width="960" height="540" fill="#121417"/>
  <rect x="0" y="0" width="960" height="14" fill="#1e2228"/>
  <rect x="0" y="14" width="960" height="22" fill="#1a1d21"/>
  <text x="8" y="29" fill="#9aa6b5" font-size="9" font-family="sans-serif">1 Model   2 Setup   3 Operations   4 Simulate</text>
  <rect x="0" y="36" width="150" height="486" fill="#1a1d21"/>
  <text x="8" y="52" fill="#9aa6b5" font-size="8" font-family="sans-serif">PROJECT</text>
  <rect x="810" y="36" width="150" height="486" fill="#1a1d21"/>
  <text x="818" y="52" fill="#9aa6b5" font-size="8" font-family="sans-serif">INSPECTOR</text>
  <rect x="150" y="36" width="660" height="22" fill="#1e2228"/>
  <g font-family="sans-serif" font-size="8.5">
    <text x="158" y="50" fill="#c9d1d9">Shaded Wire Edges | Persp Ortho | Front Top Iso | Fit</text>
    <rect x="410" y="40" width="34" height="14" rx="2" fill="#2a3038" stroke="#4a525c"/>
    <text x="414" y="50" fill="#e6e9ee">Show ⏷</text>
    <rect x="448" y="40" width="70" height="14" rx="7" fill="none" stroke="#f2b84b"/>
    <text x="483" y="50" fill="#f2b84b" text-anchor="middle">Hidden: Rapid</text>
    <text x="526" y="50" fill="#c9d1d9">Show: ☐ Part ☑ Cut part ☑ Toolpaths</text>
  </g>
  <rect x="150" y="58" width="660" height="380" fill="#15171a"/>
  <ellipse cx="480" cy="250" rx="160" ry="52" fill="#7b828c" opacity="0.6"/>
  <path d="M330 250 C 400 180, 560 180, 630 250" stroke="#ffb454" stroke-width="1.6" fill="none"/>
  <path d="M340 262 C 410 200, 550 200, 620 262" stroke="#ffb454" stroke-width="1.6" fill="none"/>
  <path d="M630 250 L 640 270 L 340 270 L 340 262" stroke="#6fd3a8" stroke-width="1" fill="none"/>
  <rect x="156" y="64" width="104" height="75" rx="3" fill="#1f2329" fill-opacity="0.95" stroke="#353c45"/>
  <g font-family="sans-serif" font-size="7" fill="#e6e9ee">
    <rect x="160" y="68" width="6" height="6" rx="1" fill="#3d8bff"/><line x1="169" y1="71" x2="178" y2="71" stroke="#ffb454" stroke-width="1.6"/><text x="182" y="73.5">Cut</text>
    <rect x="160" y="77" width="6" height="6" rx="1" fill="#3d8bff"/><line x1="169" y1="80" x2="178" y2="80" stroke="#6fd3a8" stroke-width="1"/><text x="182" y="82.5">Link</text>
    <rect x="160" y="86" width="6" height="6" rx="1" fill="none" stroke="#e6e9ee" stroke-width="0.6"/><line x1="169" y1="89" x2="178" y2="89" stroke="#9aa6b5" stroke-dasharray="1 1.5"/><text x="182" y="91.5">Rapid</text>
    <rect x="160" y="95" width="6" height="6" rx="1" fill="#3d8bff"/><line x1="169" y1="98" x2="178" y2="98" stroke="#e8b6ff" stroke-width="1.6"/><text x="182" y="100.5">Entry and exit</text>
    <rect x="167" y="104" width="6" height="6" rx="1" fill="#3d8bff"/><line x1="176" y1="107" x2="185" y2="107" stroke="#e8b6ff" stroke-width="1.6"/><text x="189" y="109.5">Plunge</text>
    <rect x="167" y="113" width="6" height="6" rx="1" fill="#3d8bff"/><line x1="176" y1="116" x2="185" y2="116" stroke="#e8b6ff" stroke-width="1.6"/><text x="189" y="118.5">Lead-in and ramp</text>
    <rect x="167" y="122" width="6" height="6" rx="1" fill="#3d8bff"/><line x1="176" y1="125" x2="185" y2="125" stroke="#e8b6ff" stroke-width="1.6"/><text x="189" y="127.5">Lead-out</text>
  </g>
  <rect x="756" y="64" width="42" height="42" rx="3" fill="#2a3038" stroke="#4a525c"/>
  <text x="777" y="88" fill="#9aa6b5" font-size="7" text-anchor="middle" font-family="sans-serif">cube</text>
  <rect x="156" y="300" width="118" height="92" rx="3" fill="#1f2329" stroke="#353c45"/>
  <text x="162" y="312" fill="#e6e9ee" font-size="7" font-family="sans-serif">Deviation (colour scale)</text>
  <rect x="162" y="318" width="10" height="56" fill="#4c8fd6"/>
  <text x="178" y="388" fill="#9aa6b5" font-size="6.5" font-family="sans-serif">Held region · Tab</text>
  <text x="160" y="430" fill="#ff7b72" font-size="7" font-family="sans-serif">X</text>
  <rect x="692" y="380" width="106" height="48" rx="3" fill="#1f2329" stroke="#353c45"/>
  <text x="698" y="394" fill="#9aa6b5" font-size="7" font-family="monospace">X  Y  Z  A (readout)</text>
  <rect x="150" y="438" width="660" height="84" fill="#1a1d21"/>
  <text x="158" y="454" fill="#9aa6b5" font-size="8" font-family="sans-serif">Playback (dock)</text>
  <rect x="0" y="522" width="960" height="18" fill="#1e2228"/>
  <g font-family="sans-serif" font-size="9" fill="#9aa6b5">
    <text x="300" y="490">With Toolpaths unticked, the legend is not drawn; the chip stays while a kind is hidden.</text>
    <text x="300" y="504">In a short view the legend collapses to a "Legend" button where it would meet the scale.</text>
  </g>
</svg>
