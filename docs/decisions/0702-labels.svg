<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1240" viewBox="0 0 1600 1240"><rect width="1600" height="1240" fill="#1c1e23"/><text x="40.0" y="50.0" fill="#e6e8ec" font-size="24" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Facing overlay labels: proposed wording (mock-up, not a capture)</text><text x="40.0" y="80.0" fill="#9aa0aa" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Baluster, box stock 72.4 × 35 × 35 mm, Box facing of +Z, +Y, −Z and −Y (A 0°, 90°, 180°, 270°), start held 8 mm. Every label 32 characters or fewer; values as today&#x27;s overlay gives them.</text><line x1="502.2" y1="505.5" x2="949.5" y2="403.3" stroke="#3d8bff" stroke-width="2" stroke-dasharray="7 5"/><line x1="616.8" y1="571.1" x2="1064.1" y2="468.8" stroke="#3d8bff" stroke-width="2" stroke-dasharray="7 5"/><line x1="616.8" y1="407.3" x2="1064.1" y2="305.0" stroke="#3d8bff" stroke-width="2" stroke-dasharray="7 5"/><line x1="502.2" y1="341.7" x2="949.5" y2="239.5" stroke="#3d8bff" stroke-width="2" stroke-dasharray="7 5"/><polygon points="502.2,505.5 616.8,571.1 616.8,407.3 502.2,341.7" stroke="#3d8bff" stroke-width="2" fill="none" stroke-dasharray="7 5"/><polygon points="949.5,403.3 1064.1,468.8 1064.1,305.0 949.5,239.5" stroke="#3d8bff" stroke-width="2" fill="none" stroke-dasharray="7 5"/><polygon points="426.5,533.0 573.5,617.0 573.5,407.0 426.5,323.0" stroke="#8f7bff" stroke-width="2" fill="#8f7bff2a"/><polygon points="482.5,520.2 629.5,604.2 629.5,394.2 482.5,310.2" stroke="#8f7bff" stroke-width="2" fill="#8f7bff2a"/><line x1="570.0" y1="454.0" x2="990.0" y2="358.0" stroke="#c8ccd4" stroke-width="44" stroke-linecap="round" opacity="0.5"/><line x1="458.0" y1="479.6" x2="1062.8" y2="341.4" stroke="#9aa0aa" stroke-width="1" stroke-dasharray="7 5"/><text x="1068.8" y="345.4" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">rotary axis (X)</text><line x1="502.2" y1="341.7" x2="616.8" y2="407.3" stroke="#3d8bff" stroke-width="3"/><circle cx="1064.1" cy="305.0" r="3.5" fill="#3d8bff"/><text x="1076.1" y="299.0" fill="#3d8bff" font-size="15" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">Face A 0°: 13.650 mm from axis</text><circle cx="1064.1" cy="468.8" r="3.5" fill="#3d8bff"/><text x="1076.1" y="486.8" fill="#3d8bff" font-size="15" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">Face A 90°: 13.650 mm from axis</text><circle cx="949.5" cy="403.3" r="3.5" fill="#3d8bff"/><text x="961.5" y="425.3" fill="#3d8bff" font-size="15" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">Face A 180°: 13.650 mm from axis</text><circle cx="949.5" cy="239.5" r="3.5" fill="#3d8bff"/><text x="961.5" y="229.5" fill="#3d8bff" font-size="15" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">Face A 270°: 13.650 mm from axis</text><circle cx="502.2" cy="341.7" r="3.5" fill="#3d8bff"/><line x1="502.2" y1="341.7" x2="386.0" y2="245.0" stroke="#3d8bff" stroke-width="1"/><text x="380.0" y="250.0" fill="#3d8bff" font-size="15" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="end">Faced from X 25.490 (held start)</text><circle cx="616.8" cy="407.3" r="3.5" fill="#4cc38a"/><line x1="616.8" y1="407.3" x2="386.0" y2="425.0" stroke="#4cc38a" stroke-width="1"/><text x="380.0" y="430.0" fill="#4cc38a" font-size="15" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="end">A 0° to A 180°: 27.300 mm apart</text><circle cx="616.8" cy="571.1" r="3.5" fill="#4cc38a"/><line x1="616.8" y1="571.1" x2="386.0" y2="615.0" stroke="#4cc38a" stroke-width="1"/><text x="380.0" y="620.0" fill="#4cc38a" font-size="15" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="end">A 90° to A 270°: 27.300 mm apart</text><rect x="1080" y="520" width="480" height="150" rx="6" fill="#23262d" stroke="#3a3e46"/><text x="1096.0" y="548.0" fill="#e6e8ec" font-size="15" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Key</text><line x1="1096.0" y1="572.0" x2="1140.0" y2="572.0" stroke="#3d8bff" stroke-width="2" stroke-dasharray="7 5"/><text x="1152.0" y="577.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Facing extent: a face, and where facing stops</text><line x1="1096.0" y1="600.0" x2="1140.0" y2="600.0" stroke="#4cc38a" stroke-width="2" stroke-dasharray="7 5"/><text x="1152.0" y="605.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Margin, and the distance between opposite faces</text><polygon points="1096.0,620.0 1140.0,620.0 1140.0,636.0 1096.0,636.0" stroke="#8f7bff" stroke-width="2" fill="#8f7bff33"/><text x="1152.0" y="633.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Held region (grip), as today</text><text x="1096.0" y="660.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Colours and dashes are the overlay&#x27;s own; only the words change.</text><text x="40.0" y="730.0" fill="#e6e8ec" font-size="19" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Each kind of label</text><text x="40.0" y="764.0" fill="#9aa0aa" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Label</text><text x="250.0" y="764.0" fill="#9aa0aa" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Today (characters)</text><text x="700.0" y="764.0" fill="#9aa0aa" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Proposed (characters)</text><text x="1040.0" y="764.0" fill="#9aa0aa" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">What the value means</text><line x1="40.0" y1="774.0" x2="1560.0" y2="774.0" stroke="#3a3e46" stroke-width="1"/><text x="40.0" y="802.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Face (Box, Flat)</text><text x="250.0" y="802.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">End facing · draft · A 0.000° · plane offset 13.650</text><text x="250.0" y="820.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">mm · margin 0.000 mm (72)</text><text x="700.0" y="802.0" fill="#3d8bff" font-size="14" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">Face A 0°: 13.650 mm from axis (30)</text><text x="1040.0" y="802.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">The face cut at A 0°; its finished plane lies 13.650 mm from</text><text x="1040.0" y="820.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">the rotary axis.</text><text x="40.0" y="854.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Margin (only if not 0)</text><text x="250.0" y="854.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">… · margin 0.500 mm, on every face label</text><text x="700.0" y="854.0" fill="#4cc38a" font-size="14" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">Margin: 0.500 mm past the edges (31)</text><text x="1040.0" y="854.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Facing covers 0.500 mm beyond the extent&#x27;s edges. One label,</text><text x="1040.0" y="872.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">on the margin outline.</text><text x="40.0" y="906.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Opposite faces</text><text x="250.0" y="906.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">End facing · draft · Opposite-plane separation</text><text x="250.0" y="924.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">27.300 mm (56)</text><text x="700.0" y="906.0" fill="#4cc38a" font-size="14" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">A 0° to A 180°: 27.300 mm apart (31)</text><text x="1040.0" y="906.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Finished thickness between the two opposite faces. Once per</text><text x="1040.0" y="924.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">pair, beside its own faces.</text><text x="40.0" y="958.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Stop beside a grip</text><text x="250.0" y="958.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">End facing · draft · Not faced: held start (41)</text><text x="700.0" y="958.0" fill="#3d8bff" font-size="14" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">Faced from X 25.490 (held start) (32)</text><text x="1040.0" y="958.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Facing starts at X 25.490 because the start end is held; the</text><text x="1040.0" y="976.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">notes say how much is left unfaced.</text><text x="40.0" y="1010.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Stop, far end</text><text x="250.0" y="1010.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">… Not faced: held far end</text><text x="700.0" y="1010.0" fill="#3d8bff" font-size="14" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">Faced up to X 85.990 (held end) (31)</text><text x="1040.0" y="1010.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Facing ends at that X because the far end is held.</text><text x="40.0" y="1062.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">End facing</text><text x="250.0" y="1062.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">… Target X 89.390 mm · length to opposite model end</text><text x="250.0" y="1080.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">72.400 mm (~85)</text><text x="700.0" y="1062.0" fill="#3d8bff" font-size="14" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">End face at X 89.390 mm (23)</text><text x="1040.0" y="1062.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Where the end face is cut, along the rotary axis. The length</text><text x="1040.0" y="1080.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">moves to the notes.</text><text x="40.0" y="1114.0" fill="#e6e8ec" font-size="14" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="bold" text-anchor="start">Round facing</text><text x="250.0" y="1114.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">… Nominal Ø22.000 mm · X 16.990…80.990 mm · axial</text><text x="250.0" y="1132.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">margin 0.000 mm (~90)</text><text x="700.0" y="1114.0" fill="#3d8bff" font-size="14" font-family="DejaVu Sans Mono, Menlo, monospace" font-weight="normal" text-anchor="start">Ø22.000 mm · X 17.990–80.990 (28)</text><text x="1040.0" y="1114.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">The finished diameter and the X range it covers. Axial margin</text><text x="1040.0" y="1132.0" fill="#e6e8ec" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">as its own label, only if not 0.</text><text x="40.0" y="1172.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">Also: &quot;draft&quot; and the operation name leave every label (the notes still say a Facing extent is a draft until you generate); the tessellation caveat stays in the notes only;</text><text x="40.0" y="1192.0" fill="#9aa0aa" font-size="13" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-weight="normal" text-anchor="start">the labels read the same before and after Generate. A choice for the owner: &quot;Face A 0°&quot; (the rotary angle) or &quot;+Z face (A 0°)&quot; (the box side and the angle, 32 characters).</text></svg>