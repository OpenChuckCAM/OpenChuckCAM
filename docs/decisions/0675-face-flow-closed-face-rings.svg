<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420" font-family="Helvetica, Arial, sans-serif" font-size="13" role="img">
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<title>Face-flow finishing on a face that closes round on itself: the seam, the two ends and the rings</title>
<rect x="0" y="0" width="860" height="420" fill="#ffffff"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<text x="20" y="28" fill="#222222" font-size="14" font-weight="bold">Before: refused</text>
<text x="20" y="46" fill="#444444" font-size="12">The seam bounds the face twice but is listed once,</text>
<text x="20" y="62" fill="#444444" font-size="12">so the boundary chain cannot close.</text>
<g transform="translate(40,90)">
  <ellipse cx="40" cy="120" rx="30" ry="100" fill="none" stroke="#1f5fbf" stroke-width="3"/>
  <path d="M40,20 L280,20 M40,220 L280,220" stroke="#888888" stroke-width="1.5" fill="none"/>
  <path d="M280,20 A30,100 0 0 1 280,220" stroke="#1f5fbf" stroke-width="3" fill="none"/>
  <path d="M280,220 A30,100 0 0 1 280,20" stroke="#1f5fbf" stroke-width="2" stroke-dasharray="5,4" fill="none"/>
  <line x1="12" y1="140" x2="252" y2="140" stroke="#c0392b" stroke-width="3"/>
  <text x="70" y="160" fill="#c0392b" font-size="12">seam: one edge, used twice</text>
  <text x="2" y="250" fill="#1f5fbf" font-size="12">end loop</text>
  <text x="232" y="250" fill="#1f5fbf" font-size="12">end loop</text>
  <text x="70" y="290" fill="#c0392b" font-size="13" font-weight="bold">"the boundary does not close"</text>
</g>
<line x1="400" y1="40" x2="400" y2="390" stroke="#dddddd" stroke-width="1"/>
<text x="430" y="28" fill="#222222" font-size="14" font-weight="bold">Option A (built): rings from one end to the other</text>
<text x="430" y="46" fill="#444444" font-size="12">The seam is not a boundary. The longer end is the guide;</text>
<text x="430" y="62" fill="#444444" font-size="12">each pass is a ring blended towards the other end.</text>
<g transform="translate(450,90)">
  <path d="M40,20 L300,40 M40,220 L300,200" stroke="#888888" stroke-width="1.5" fill="none"/>
  <ellipse cx="40" cy="120" rx="30" ry="100" fill="none" stroke="#1f5fbf" stroke-width="4"/>
  <ellipse cx="300" cy="120" rx="24" ry="80" fill="none" stroke="#1f5fbf" stroke-width="2.5"/>
  <ellipse cx="105" cy="120" rx="28.5" ry="95" fill="none" stroke="#e8902a" stroke-width="2"/>
  <ellipse cx="170" cy="120" rx="27" ry="90" fill="none" stroke="#e8902a" stroke-width="2"/>
  <ellipse cx="235" cy="120" rx="25.5" ry="85" fill="none" stroke="#e8902a" stroke-width="2"/>
  <line x1="10" y1="120" x2="276" y2="120" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="320" y="124" fill="#c0392b" font-size="11">seam: rings start</text><text x="320" y="138" fill="#c0392b" font-size="11">and end here</text>
  <text x="-10" y="250" fill="#1f5fbf" font-size="12" font-weight="bold">guide: the longer end</text>
  <text x="240" y="230" fill="#1f5fbf" font-size="12">opposite end</text>
  <line x1="60" y1="275" x2="280" y2="275" stroke="#222222" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="70" y="295" fill="#222222" font-size="12">passes step at the stepover, measured on the face</text>
</g>
<text x="20" y="408" fill="#444444" font-size="12">An end that is a point (a cone's tip) closes the rings. A face with no end (a whole sphere or torus) is refused, and so is the seam chosen as the guide.</text>
</svg>
