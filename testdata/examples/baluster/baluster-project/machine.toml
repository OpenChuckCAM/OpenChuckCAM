[machine.provenance.rotary_axis]
state = "confirmed"
source = "confirmed by the owner from use of the machine (11 Oct 2026): the rotary axis is along X. Consistent with 7 of 7 Makera 4-axis profiles (Fusion Z1, Carvera, Carvera Air and Carvera Harmonic; FreeCAD Z1, C1 and Air) and the Makera Mastercam and Carveco posts (decision 0013). Rechecked by the owner on firmware 1.1.3 (11 to 14 Nov 2026, issue #586 comment 6805176778, decision 0649): the SP-12 conventions hold"

[machine.provenance.a_sense]
state = "confirmed"
source = "confirmed by the owner from use of the machine (11 Oct 2026): positive A is right-handed about +X, so the side facing up at A 0 faces machine -Y at A +90. Checked again on the machine on 13 Oct 2026 by sending an A+ command: a camera behind the chuck, looking toward home, sees the top of the chuck turn toward the front of the machine (away from home, -Y): clockwise from that view, counter-clockwise looking at the chuck from +X. Consistent with the Fusion (4 four-axis machine files), Mastercam and SolidCAM profiles. The SP-12 air cut (14 Oct 2026, firmware 1.1.2, decision 0007) confirmed it a third time: at A +90 the top moved toward the front. Rechecked by the owner on firmware 1.1.3 (11 to 14 Nov 2026, issue #586 comment 6805176778, decision 0649): the SP-12 conventions hold"

[machine.provenance.rotary_origin]
state = "confirmed"
source = "the reference point is the centre of the face of the headstock body next to the chuck, where the controller works from (the owner, 14 Nov 2026, decision 0649; OI-60 closed). X and Y confirmed by the owner on firmware 1.1.3. Y: the axis is at machine Y -124.39, the G54 Y the firmware sets in the 4-axis setup (the owner's `$#`, 21 Nov 2026: G54 -118.3900, -124.3900); decision 0649 gave -123.39, a typo, and decision 0651 corrects it. X: G54 set in 4-axis mode read X -115.34 in machine coordinates, with the owner's X0 83.050 mm toward +X from the headstock face, so the face is at machine X -198.39. They replace the published Z1 config's anchor1 plus rotation offset (-180.4, -108.8), which this machine does not use. The chuck's front face is not the datum: its distance from the headstock varies with the jaws used. Z: -48.6 is the machine Z (G53) of the axis with the probe as the reference tool, from Makera's 4th-axis Z probing routine on the owner's Z1 (gate 4, PR 284 comment 6399134358, firmware 1.1.2, decision 0317). The routine touches a point on the headstock 23 mm above the chuck centre and sets G54 Z0 on the axis; it makes the probe the reference tool, so another tool's tool length offset raises or lowers the spindle by its length difference from the probe. Rechecked on firmware 1.1.3 (11 to 14 Nov 2026): the axis height measured 48.568, consistent with -48.6; with G54 Z0 on the axis the machine Z was -67.657 with a tool length offset of -19.09 and -68.180 with -19.612, each the axis height plus the offset"

[machine.provenance.a_range]
state = "confirmed"
source = "confirmed by the owner from use of the machine (11 Oct 2026): the A axis is continuous. Consistent with Fusion (no limits, never reset), FreeCAD (+/-1e7, unwound), Mastercam (signed continuous) and the Z1 firmware (no A soft limit). The air cut turned A to 570 and -370 and unwound by `G92.4 A0 S0` with no limit stop. Rechecked by the owner on firmware 1.1.3 (11 to 14 Nov 2026, issue #586 comment 6805176778, decision 0649): the SP-12 conventions hold"

[machine.provenance.travel]
state = "confirmed"
source = "the firmware's soft limits on 1.1.3, measured by the owner (14 Nov 2026, decision 0649): X -207 to -1, Y -160 to -1 and Z -102 to -1 in machine coordinates (G53). Near home a move to -0.9 is refused on all three axes; at the far ends the soft limit triggers beyond X -207, Y -160 and Z -102. The refusal's text was not recorded. Y -160 matches the firmware's note that, with the rotary module fitted and soft limits on, Y is held above -160; the published config gives -206/-206/-102 (decision 0013). Frame is the firmware's G53 with home at 0"

[machine.provenance.max_feeds]
state = "confirmed"
source = "confirmed by the owner from use of the machine (11 Oct 2026): X and Y 1200 mm/min, Z 600 mm/min (decision 0013). A 1800 deg/min (30 deg/s), confirmed by the owner on firmware 1.1.3 (relayed 14 Nov 2026): M203.1 in the console prints A: 30. The firmware caps A's configured maximum rate (3600 deg/min in the Z1 config) at 1800 deg/min when bit 0 of the factory setting FuncSetting is set (Robot.cpp:295-298, in 1.1.2 and 1.1.3), and in the 0.55.0-rc2 gate 4 run the sphere took 127 s where the estimate at 3600 deg/min was 81 s (decision 0647). Check with M203.1: a Z1 that prints A: 60 can raise A in its own copy. Consistent with the 1200 reported from Makera Studio; the CAM profiles' figures are template values and were not used (decision 0013). How the firmware counts A in the F word was measured by the SP-12 air cut on firmware 1.1.2 (decision 0007, tests T3 and T4); the feed limits are applied to that length (decision 0076). On firmware 1.1.3 M203.1 prints X: 20, Y: 20 and Z: 10 (mm/s), so X and Y 1200 and Z 600 mm/min are confirmed from the controller (owner, 14 Nov 2026, decision 0649). The rapid limits are the same per-axis maximum rates, confirmed by the owner's timed G0 moves (G53, no tool, 100 %, firmware 1.1.3, 14 Nov 2026): X -10 to -110 (100 mm) took 5.3 s (5.0 s at 1200 mm/min plus acceleration); Z -5 to -55 (50 mm) 5.13 s (5.0 s at 600); A 0 to 360 12.22 s (12.0 s at 1800 deg/min)"

[machine.provenance.clearance]
state = "confirmed"
source = "the owner's default (14 Nov 2026, decision 0649), confirmed by the owner: a safe cylinder radius and safe Z of 45 mm, set to the measured minimum clearance radius for the supplied chuck (Sanou K02-50, jaws reversed and fully open); it replaces 40 (decision 0317). At safe Z 45 the probe's tip is at machine Z -3.6, 2.6 mm below the top of the travel, and a longer tool raises the spindle. Set a clearance on each setup to suit its stock and workholding"

[machine.provenance.min_block_ms]
state = "confirmed"
source = "Owner gate 4, PR 284 comment 6399134358, submitted 25 Oct 2026: firmware 1.1.2, ESP32 (version not supplied), WiFi upload; 7, 10 and 20 ms passed in both parts, 5/3/2/1 ms stuttered. K4 retained by the owner as a release waiver; subsequent LinuxCNC replay passed. This measured program/transport only (decision 0222). Confirmed again on firmware 1.1.3, ESP32 1.1.3, WiFi upload (owner, 14 Nov 2026, decision 0648): the air cut ran as one file per section; 7, 10 and 20 ms ran smoothly in both parts, 5 ms stuttered"

[machine.provenance.block_window]
state = "confirmed"
source = "32 blocks, confirmed by the owner's statement (14 Nov 2026, decision 0649). The 32-block planner queue comes from the firmware source; the averaging rule is decision 0222 item 3. Not a separately measured queue depth: decision 0648 found that the source model's timing of short blocks fails below 5 ms"

[machine.provenance.short_block_mode]
state = "confirmed"
source = "Report, confirmed by the owner as the default (14 Nov 2026, decision 0649) from the gate 4 block-rate testing: on firmware 1.1.2 (decision 0222) and 1.1.3 (decision 0648) 7 ms ran smoothly and 5 ms stuttered. A software policy (decision 0222), not a controller measurement"

[machine.provenance.spindle_range]
state = "confirmed"
source = "4000 to 13000 rpm, confirmed by the owner on firmware 1.1.3 (14 Nov 2026, decision 0649). The lowest was observed with T1 M6 and no tool: the spindle runs when S is 1000 or above, and no slower than 4000 rpm. The highest is the owner's statement that it has been tested (no run details recorded). Makera's published specification, the Makera Z1 Safety Guidelines, V1.3 (makera.com, file MakeraZ1-Safety_Guidelines-V1.3-multi-lan-260709-1.pdf), gives 0 to 13 000 rpm with closed-loop control (decision 0231)"

[machine.provenance.tool_length_measurement]
state = "confirmed"
source = "confirmed by the owner (30 Oct 2026, decision 0317): the Z1 measures each tool on its tool setter and offsets it from the probe as the reference tool (firmware 1.1.2, ATCHandler.cpp:1909-1919; Robot.cpp:498-506). On firmware 1.1.3 (owner, 14 Nov 2026, decision 0649) M5, T1 M6 and T2 M6 showed the tool change, touched off on the measurement switch and returned to the G28 position, with the offsets as expected (OI-41)"

[machine.provenance.spindle_to_axis]
state = "confirmed"
source = "measured by the owner on firmware 1.1.3 (14 Nov 2026, decision 0649): with no tool and the tool length offset calibrated to the collet face (offset -24.433), G54 Z0 on the axis reads machine Z -73.000, so the collet face at machine Z 0 is 73.000 mm above the axis; a dummy tool 4.821 mm from the collet face (offset -19.612, machine Z -68.180) gives 73.001. 72.0 is 73.000 less 1 mm to the top of the Z travel, the soft limit at machine Z -1. It replaces 73.1, derived from the probe's stick-out measured with a caliper, 24.5 (decision 0318, issue #395); the probe's stick-out on the tool setter is 24.433"

[machine.provenance.recommended_min_safe_z]
state = "confirmed"
source = "the owner's recommendation, confirmed by the owner (14 Nov 2026, decision 0649), from the minimum clearance radius measured for one chuck and jaw setup (the supplied Sanou K02-50, jaws reversed and fully open); it replaces 30 (decision 0317). The recommended minimum is 45 mm. This must be checked before machining."

[machine.provenance.min_clearance_radius]
state = "confirmed"
source = "measured by the owner on firmware 1.1.3 (14 Nov 2026, decision 0649, OI-1780): a clearance radius of 45 mm about the rotary axis clears the supplied Sanou K02-50 chuck with its jaws in the reverse configuration, fully open (60 mm chuck opening). It holds for that chuck and jaw setup only: other chucks, jaw configurations and a tailstock are not covered, so set the setup's own minimum clearance for them. Jaws gripping smaller stock reach less far"
