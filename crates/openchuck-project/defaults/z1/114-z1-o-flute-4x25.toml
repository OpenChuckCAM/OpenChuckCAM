# Default Makera Z1 tool, number 114 (TL-12; decision record 0081). Facts
# only: dimensions and parameters, no wording, images or file structures.
# Tool material "carbide" is the owner's decision, from the community
# profiles' material column.
# No cutting data (OI-270, owner-decided rule: a stepover only where a
# community file states one): no source states a stepover for this tool, so
# none is shipped.
# Source: bit page spiral-o-single-flute-bit-4mm-shank: diameter, flute
# length (variant sizes), shank 4, total length 50, single flute (name),
# solid carbide. Where the page lists several sizes beside several total
# lengths, the sizes are matched to the lengths by position (first size to
# first length); the community file agrees with every one; community file
# Makera O Flute Bits.csv agrees (flat end mill, overall length 50).
# Stick-out (decision record 0673): owner-provided: standard tool setup holds
# 12.7 mm inside the collet (22 Nov 2026), so stick_out = overall_length - 12.7
# (tip to collet face). Not confirmed on the machine.
schema = 1
id = "c0de0001-0000-4000-8000-000000000114"
name = "Z1 O-flute 4x25"

[tool]
diameter = 4.0
flute_length = 25.0
overall_length = 50.0
stick_out = 37.3
shank_diameter = 4.0
flute_count = 1
material = "carbide"

[tool.shape]
type = "flat_end"
