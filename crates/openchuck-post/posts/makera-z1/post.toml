# Makera Z1 post (GC-09). The conventions are derived from Makera's profiles and the Z1
# firmware source (decision 0007) and are unconfirmed until the attended air cut (OI-37),
# except the A direction, which was checked on the machine on 13 Oct 2026 (OI-03):
# right-handed A about +X, programs in G54 with Y0 Z0 on the A axis, no G93 (the stock
# firmware ignores it), the Makera feed rule, whole turns dropped with G92.4 A0 S0,
# no line numbers, comments on their own line, three decimals.
# Generated G-code is the user's to verify before running (NFR-12).
schema = 1
name = "Makera Z1"
template = "main.post"
feed_rule = "makera"

[options]
units = "mm"
a_letter = "A"
a_direction = "same"
unwind = "drop_turns"
unwind_command = "G92.4 A0 S0"
header = ["G90 G21 G17"]
footer = ["M5", "G53 G0 Z-3", "G28", "M2"]
work_offset = "G54"
coolant = "off"
# max_feed is left unset: the machine profile's feed limits already govern every move (decision 0020 item 5).
feed_mode = "g94"
# Consecutive A-only moves with nothing else changing are written as one block, so the
# controller plans one rotation instead of one per step (decision 0506, accepted).
combine_rotary_runs = true
comments = true
# The NFR-12 notice (the program is yours to check before you run it), written as comment
# lines after the generator line (decision 0533). Needs comments; false leaves it out.
safety_notice = true
# The Z1 firmware source keeps a line in a 64-byte queue item, so a longer line is cut
# without a warning (OI-933; from the source, not confirmed on the machine). Longer comments
# are wrapped; any other longer line blocks export (decision 0656).
max_line_length = 63
# active_comment_prefixes is left out: the Z1 firmware (a Smoothieware fork) skips a line that
# starts with "(" and cuts a comment off a command line, and acts on no comment (from its
# source; issue #851), so names are written as they are.
file_extension = "nc"

[options.tool_change]
stop_spindle_first = true
length_offset = false

[options.line_numbers]
enabled = false
start = 10
step = 10

[options.decimals]
pos = 3
a = 3
f = 1
